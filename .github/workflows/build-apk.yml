name: Build & Release APK

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Optional custom release title'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK Environment & Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          touch .env.example

      - name: Build APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError' -Djava.awt.headless=true"
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace -x test -Djava.awt.headless=true

      - name: Locate Built APK & Prepare Release Assets
        id: find_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK file found in app/build/outputs/apk!"
            exit 1
          fi
          echo "Found APK at: $RAW_APK"
          mkdir -p release-assets
          cp "$RAW_APK" release-assets/TeleStream-debug.apk
          cp "$RAW_APK" release-assets/app-release.apk
          echo "apk_path=release-assets/TeleStream-debug.apk" >> $GITHUB_OUTPUT
          echo "std_apk_path=release-assets/app-release.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleStream-Debug-APK
          path: release-assets/*.apk

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ inputs.release_title != '' && inputs.release_title || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('TeleStream Release v1.0.{0}', github.run_number)) }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🚀 TeleStream Automated Build
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Build Run**: #${{ github.run_number }}
            - **Changelog**: Automated APK compiled and verified for in-app OTA updates.
          files: |
            release-assets/TeleStream-debug.apk
            release-assets/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
